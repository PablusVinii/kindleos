name: Build and Deploy

on:
  push:
    branches: [ main ] # Ensure this matches your branch name (e.g. 'main' or 'master')
  workflow_dispatch: # Allows manual runs from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Uses Node 20 to fix dependency errors

      - name: Install dependencies
        run: npm ci

      - name: Static audit + unit tests
        run: npm test

      - name: Build
        run: npm run build

      # NOTE: cloudflare/pages-action was deprecated and removed on 2026-09-18
      # (CVE-2026-11325), so GitHub can no longer resolve it. Cloudflare's
      # recommended replacement is cloudflare/wrangler-action.
      - name: Publish Main
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy _deploy/main --project-name=rekindle --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # Deploy LITE Site to the 'rekindle-lite' project
      - name: Publish Lite
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy _deploy/lite --project-name=rekindle-lite --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # Deploy LEGACY Site to the 'rekindle-legacy' project
      - name: Publish Legacy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy _deploy/legacy --project-name=rekindle-legacy --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
