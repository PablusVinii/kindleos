<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <meta charset="UTF-8">
    <title data-i18n="gutenberg.title">Gutenberg</title>
    <script src="theme.js?v=18"></script>
    <script src="js/i18n.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border: 2px solid #000000;
            --shadow: 4px 4px 0px #000000;
            --stripe-pattern: repeating-linear-gradient(0deg, transparent, transparent 2px, #000 3px, #000 4px);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            transition: none !important;
            animation: none !important;
        }

        body {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            font-family: "Geneva", "Verdana", sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: #e5e5e5;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-text-size-adjust: none;
        }

        /* ---------- WINDOW ---------- */
        .window {
            background: white;
            border: 2px solid black;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            width: 95%;
            max-width: 600px;
            height: 90vh;
            position: relative;
            overflow: hidden;
        }

        .title-bar {
            height: 35px;
            border-bottom: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            position: relative;
            flex-shrink: 0;
        }

        .title-stripes {
            position: absolute;
            top: 4px;
            bottom: 4px;
            left: 4px;
            right: 4px;
            background-image: var(--stripe-pattern);
            z-index: 0;
        }

        .title-text {
            background: white;
            padding: 0 15px;
            font-weight: bold;
            font-size: 1.1rem;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            height: 100%;
            border: none;
        }

        .close-box {
            position: absolute;
            left: 10px;
            width: 18px;
            height: 18px;
            border: 2px solid black;
            background: white;
            z-index: 2;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-family: sans-serif;
            font-size: 0.9rem;
            line-height: 1;
            box-shadow: 2px 2px 0 black;
        }

        /* Expand the 18px close box into a 44px touch target without
           changing the standard System 7 visual. */
        .close-box::after {
            content: "";
            position: absolute;
            top: -13px;
            left: -13px;
            right: -13px;
            bottom: -13px;
        }

        .close-box:active {
            background: black;
            color: white;
            transform: translate(1px, 1px);
            box-shadow: none;
        }

        /* ---------- VIEWS ---------- */
        .view {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: white;
        }

        #view-reader {
            display: none;
        }

        /* ---------- CONTROLS ---------- */
        .sys-btn {
            background: white;
            color: black;
            border: 2px solid black;
            border-radius: 0;
            box-shadow: 2px 2px 0 black;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.9rem;
            padding: 0 10px;
            min-height: 44px;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        .sys-btn:active {
            background: black;
            color: white;
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .sys-btn[disabled] {
            opacity: 0.4;
            background: white;
            color: black;
            box-shadow: none;
            transform: none;
            cursor: default;
        }

        /* ---------- SEARCH VIEW ---------- */
        .search-top {
            flex-shrink: 0;
            padding: 8px;
            background: #eee;
            border-bottom: 2px solid black;
        }

        .search-row {
            display: flex;
            align-items: stretch;
        }

        #q {
            flex: 1 1 auto;
            min-width: 0;
            height: 44px;
            padding: 0 8px;
            border: 2px solid black;
            border-radius: 0;
            background: white;
            color: black;
            font-family: inherit;
            font-size: 1rem;
            -webkit-appearance: none;
            appearance: none;
        }

        #search-btn {
            flex: 0 0 auto;
            margin-left: 6px;
            min-width: 78px;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .chip {
            margin: 0 6px 6px 0;
            min-height: 44px;
            padding: 0 10px;
            font-size: 0.8rem;
            box-shadow: 2px 2px 0 black;
        }

        #search-scroll {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 10px;
            -webkit-overflow-scrolling: touch;
        }

        #shelf {
            display: none;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid black;
            padding-bottom: 3px;
            margin-bottom: 6px;
        }

        .recent {
            display: flex;
            align-items: stretch;
            margin-bottom: 8px;
            border: 2px solid black;
            background: #f5f5f5;
            box-shadow: 2px 2px 0 black;
        }

        .recent-open {
            flex: 1 1 auto;
            min-width: 0;
            text-align: left;
            background: transparent;
            border: 0;
            border-radius: 0;
            padding: 4px 8px;
            min-height: 48px;
            font-family: inherit;
            color: black;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        .recent-title {
            display: block;
            font-weight: bold;
            font-size: 0.85rem;
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .recent-meta {
            display: block;
            font-size: 0.72rem;
            line-height: 1.3;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .recent-x {
            flex: 0 0 44px;
            width: 44px;
            min-height: 44px;
            border: 0;
            border-left: 2px solid black;
            border-radius: 0;
            background: white;
            color: black;
            font-family: inherit;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        .recent-x:active {
            background: black;
            color: white;
        }

        .status {
            display: none;
            font-size: 0.82rem;
            line-height: 1.4;
            margin: 0 0 10px 0;
            padding: 6px 8px;
            border: 2px solid black;
            background: #f5f5f5;
        }

        .status-error {
            font-weight: bold;
            background: white;
        }

        .book {
            display: block;
            width: 100%;
            text-align: left;
            background: white;
            color: black;
            border: 2px solid black;
            border-radius: 0;
            box-shadow: 2px 2px 0 black;
            padding: 7px 9px;
            margin: 0 0 8px 0;
            min-height: 44px;
            font-family: inherit;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        .book:active {
            background: #eee;
            transform: translate(1px, 1px);
            box-shadow: none;
        }

        .book-title {
            display: block;
            font-weight: bold;
            font-size: 0.9rem;
            line-height: 1.25;
        }

        .book-meta {
            display: block;
            font-size: 0.76rem;
            line-height: 1.35;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #more-wrap {
            display: none;
            margin-top: 4px;
        }

        #more-btn {
            width: 100%;
            font-size: 0.82rem;
        }

        /* ---------- READER VIEW ---------- */
        #reader-head {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            background: #eee;
            border-bottom: 2px solid black;
            padding: 2px 4px 2px 8px;
            min-height: 48px;
        }

        .rh-text {
            flex: 1 1 auto;
            min-width: 0;
            padding-right: 4px;
        }

        #r-title {
            display: block;
            font-weight: bold;
            font-size: 0.85rem;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #r-author {
            display: block;
            font-size: 0.72rem;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #r-source {
            display: block;
            font-size: 0.64rem;
            line-height: 1.3;
            color: #444444;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #reader-head.collapsed #r-author,
        #reader-head.collapsed #r-source {
            display: none;
        }

        #head-toggle {
            flex: 0 0 44px;
            width: 44px;
            padding: 0;
            font-family: "Courier New", monospace;
            font-size: 1rem;
        }

        #notice {
            flex-shrink: 0;
            display: none;
            padding: 4px 8px;
            background: #fffbe6;
            border-bottom: 2px solid black;
            font-size: 0.72rem;
            font-weight: bold;
            line-height: 1.3;
            text-align: center;
        }

        #pane {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
            padding: 12px 14px;
            background: white;
            color: black;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 18px;
            line-height: 1.55;
            -webkit-overflow-scrolling: touch;
            word-wrap: break-word;
            overflow-wrap: break-word;
            scroll-behavior: auto;
        }

        #pane p {
            margin: 0 0 0.85em 0;
        }

        #pane p.gb-h {
            font-family: "Geneva", "Verdana", sans-serif;
            font-weight: bold;
            font-size: 1em;
            text-align: center;
            margin: 1.3em 0 0.9em 0;
        }

        #pane p.gb-status {
            font-family: "Geneva", "Verdana", sans-serif;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        #pane p.gb-error {
            font-weight: bold;
        }

        .bottombar {
            flex-shrink: 0;
            border-top: 2px solid black;
            background: #eee;
            padding: 4px 6px;
        }

        .brow {
            display: flex;
            align-items: center;
        }

        .brow + .brow {
            margin-top: 4px;
        }

        .brow > * + * {
            margin-left: 6px;
        }

        #page-ind {
            flex: 1 1 auto;
            min-width: 0;
            text-align: center;
            font-family: "Courier New", monospace;
            font-size: 0.78rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
        }

        #btn-prev,
        #btn-next {
            flex: 0 0 60px;
            padding: 0;
            font-size: 0.82rem;
        }

        #btn-fontdown,
        #btn-fontup {
            flex: 0 0 50px;
            padding: 0;
            font-family: "Courier New", monospace;
        }

        #btn-contents,
        #btn-back {
            flex: 1 1 0;
            min-width: 0;
            padding: 0 4px;
            font-size: 0.8rem;
        }

        /* ---------- CONTENTS MODAL ---------- */
        #gb-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            font-family: "Geneva", "Verdana", sans-serif;
        }

        #gb-modal.open {
            display: flex;
        }

        .gb-modal-box {
            background: white;
            border: 2px solid black;
            box-shadow: 6px 6px 0 black;
            width: 90%;
            max-width: 420px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .gb-modal-title {
            flex-shrink: 0;
            background: #eee;
            border-bottom: 2px solid black;
            padding: 8px 10px;
            font-weight: bold;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-top: none;
        }

        #toc-list {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding: 6px;
            -webkit-overflow-scrolling: touch;
        }

        .toc-item {
            display: block;
            width: 100%;
            text-align: left;
            background: white;
            color: black;
            border: 2px solid black;
            border-radius: 0;
            box-shadow: 2px 2px 0 black;
            margin: 0 0 6px 0;
            padding: 4px 8px;
            min-height: 44px;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: bold;
            line-height: 1.3;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        .toc-item:active {
            background: black;
            color: white;
            box-shadow: none;
            transform: translate(1px, 1px);
        }

        .toc-empty {
            padding: 10px 6px;
            font-size: 0.82rem;
            font-weight: bold;
            text-align: center;
        }

        .gb-modal-foot {
            flex-shrink: 0;
            border-top: 2px solid black;
            padding: 6px;
            display: flex;
            justify-content: flex-end;
        }

        .gb-modal-foot .sys-btn {
            min-width: 90px;
        }

        @media (max-width: 360px) {
            .chip {
                font-size: 0.75rem;
                padding: 0 8px;
            }

            #search-btn {
                min-width: 66px;
                padding: 0 6px;
                font-size: 0.82rem;
            }

            #btn-prev,
            #btn-next {
                flex: 0 0 52px;
                font-size: 0.75rem;
            }

            #btn-fontdown,
            #btn-fontup {
                flex: 0 0 44px;
            }

            #btn-contents,
            #btn-back {
                font-size: 0.74rem;
            }
        }
    </style>
</head>

<body>

    <div class="window">
        <div class="title-bar">
            <div class="title-stripes"></div>
            <div class="close-box" onclick="location.href='index'">X</div>
            <span class="title-text" data-i18n="gutenberg.title">Gutenberg</span>
        </div>

        <!-- ================= SEARCH ================= -->
        <div id="view-search" class="view">
            <div class="search-top">
                <div class="search-row">
                    <input type="text" id="q" autocomplete="off" autocorrect="off" autocapitalize="off"
                        spellcheck="false" placeholder="Title, author, or subject"
                        data-i18n-placeholder="gutenberg.ph.search">
                    <button type="button" class="sys-btn" id="search-btn"
                        data-i18n="gutenberg.btn.search">Search</button>
                </div>
                <div class="chips" id="chips">
                    <button type="button" class="sys-btn chip" data-q="Fiction"
                        data-i18n="gutenberg.chip.fiction">Fiction</button>
                    <button type="button" class="sys-btn chip" data-q="Mystery"
                        data-i18n="gutenberg.chip.mystery">Mystery</button>
                    <button type="button" class="sys-btn chip" data-q="Science Fiction"
                        data-i18n="gutenberg.chip.scifi">Science Fiction</button>
                    <button type="button" class="sys-btn chip" data-q="Poetry"
                        data-i18n="gutenberg.chip.poetry">Poetry</button>
                    <button type="button" class="sys-btn chip" data-q="History"
                        data-i18n="gutenberg.chip.history">History</button>
                    <button type="button" class="sys-btn chip" data-q="Children"
                        data-i18n="gutenberg.chip.children">Children</button>
                </div>
            </div>

            <div id="search-scroll">
                <div id="shelf">
                    <div class="section-title" data-i18n="gutenberg.shelf.title">Continue reading</div>
                    <div id="shelf-list"></div>
                </div>

                <div id="search-status" class="status"></div>
                <div id="results"></div>
                <div id="more-wrap">
                    <button type="button" class="sys-btn" id="more-btn"
                        data-i18n="gutenberg.btn.loadmore">Load more</button>
                </div>
            </div>
        </div>

        <!-- ================= READER ================= -->
        <div id="view-reader" class="view">
            <div id="reader-head">
                <div class="rh-text">
                    <span id="r-title"></span>
                    <span id="r-author"></span>
                    <span id="r-source" data-i18n="gutenberg.source">Public-domain text from Project Gutenberg</span>
                </div>
                <button type="button" class="sys-btn" id="head-toggle">-</button>
            </div>

            <div id="notice"></div>

            <div id="pane"></div>

            <div class="bottombar">
                <div class="brow">
                    <button type="button" class="sys-btn" id="btn-prev"
                        data-i18n="gutenberg.btn.prev">Prev</button>
                    <span id="page-ind"></span>
                    <button type="button" class="sys-btn" id="btn-next"
                        data-i18n="gutenberg.btn.next">Next</button>
                </div>
                <div class="brow">
                    <button type="button" class="sys-btn" id="btn-fontdown">A-</button>
                    <button type="button" class="sys-btn" id="btn-fontup">A+</button>
                    <button type="button" class="sys-btn" id="btn-contents"
                        data-i18n="gutenberg.btn.contents">Contents</button>
                    <button type="button" class="sys-btn" id="btn-back"
                        data-i18n="gutenberg.btn.back">Back</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= CONTENTS MODAL ================= -->
    <div id="gb-modal">
        <div class="gb-modal-box">
            <div class="gb-modal-title" data-i18n="gutenberg.modal.contents">Contents</div>
            <div id="toc-list"></div>
            <div class="gb-modal-foot">
                <button type="button" class="sys-btn" id="toc-close"
                    data-i18n="gutenberg.btn.close">Close</button>
            </div>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            /* ---------------- CONFIG ---------------- */
            var RECENT_KEY = 'rekindle_gb_recent';
            var POS_PREFIX = 'rekindle_gb_pos_';
            var FONT_KEY = 'rekindle_gb_font';
            var CACHE_NAME = 'rekindle-gutenberg-v1';
            var FONTS = [16, 18, 20, 24];
            var TIMEOUT = 20000;
            var MAX_CHARS = 2000000;
            var MAX_RECENT = 8;
            var MAX_TOC = 120;
            var GUTENBERG = 'https://www.gutenberg.org';

            var NUMBER_WORDS = 'one|two|three|four|five|six|seven|eight|nine|ten|' +
                'eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|' +
                'twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety|hundred|' +
                'first|second|third|fourth|fifth|sixth|seventh|eighth|ninth|tenth|last';

            var HEAD_RE = new RegExp(
                '^(chapter|book|part)[\\s.:]+(?:the[\\s.:]+)?([ivxlcdm]+|\\d+|' + NUMBER_WORDS + ')\\b', 'i');

            var SMALL_WORDS = {
                of: 1, a: 1, an: 1, the: 1, and: 1, or: 1, nor: 1, but: 1,
                to: 1, in: 1, on: 1, at: 1, by: 1, for: 1, from: 1, with: 1,
                as: 1, is: 1, it: 1
            };

            /* ---------------- STATE ---------------- */
            var state = {
                view: 'search',
                book: null,
                books: [],
                query: '',
                nextUrl: '',
                hasNext: false,
                pages: 1,
                pageIndex: 0,
                pct: 0,
                font: 18,
                headings: [],
                ready: false,
                busy: false,
                loadingMore: false,
                reqId: 0
            };

            var pane, notice, pageInd, prevBtn, nextBtn, rTitle, rAuthor, head, headToggle,
                results, moreWrap, moreBtn, searchStatus, shelf, shelfList, input,
                modal, tocList, tocClose, searchBtn, chips;

            var saveTimer = null;
            var scrollTimer = null;
            var resizeTimer = null;

            /* ---------------- SMALL HELPERS ---------------- */
            function byId(id) {
                return document.getElementById(id);
            }

            function tr(key, fallback) {
                if (typeof window.t === 'function') {
                    return window.t(key, fallback);
                }
                return fallback || key;
            }

            function esc(s) {
                return String(s).replace(/[&<>]/g, function (c) {
                    if (c === '&') return '&amp;';
                    if (c === '<') return '&lt;';
                    return '&gt;';
                });
            }

            function trim(s) {
                return String(s).replace(/^\s+|\s+$/g, '');
            }

            function stripTags(s) {
                return String(s).replace(/<[^>]*>/g, '');
            }

            function decodeEntities(s) {
                return String(s || '')
                    .replace(/&#x([0-9a-fA-F]+);/g, function (m, hex) {
                        return String.fromCharCode(parseInt(hex, 16));
                    })
                    .replace(/&#(\d+);/g, function (m, dec) {
                        return String.fromCharCode(parseInt(dec, 10));
                    })
                    .replace(/&lt;/g, '<')
                    .replace(/&gt;/g, '>')
                    .replace(/&quot;/g, '"')
                    .replace(/&apos;/g, "'")
                    .replace(/&amp;/g, '&');
            }

            function readJson(key, fallback) {
                try {
                    var raw = localStorage.getItem(key);
                    if (!raw) return fallback;
                    return JSON.parse(raw);
                } catch (e) {
                    return fallback;
                }
            }

            function writeJson(key, value) {
                try {
                    localStorage.setItem(key, JSON.stringify(value));
                } catch (e) { /* quota / private mode */ }
            }

            /* ---------------- NETWORK ---------------- */
            function proxyUrl(target) {
                return '/api/gutenberg?url=' + encodeURIComponent(target);
            }

            function tryFetch(url, timeoutMs) {
                return new Promise(function (resolve, reject) {
                    var settled = false;
                    var controller = null;
                    var timer = null;

                    function finish(err, text) {
                        if (settled) return;
                        settled = true;
                        if (timer) {
                            clearTimeout(timer);
                            timer = null;
                        }
                        if (err) {
                            reject(err);
                        } else {
                            resolve(text);
                        }
                    }

                    var opts = { method: 'GET', credentials: 'omit' };
                    if (typeof AbortController !== 'undefined') {
                        controller = new AbortController();
                        opts.signal = controller.signal;
                    }

                    timer = setTimeout(function () {
                        if (controller) {
                            try { controller.abort(); } catch (e) { /* ignore */ }
                        }
                        finish(new Error('timeout'));
                    }, timeoutMs);

                    fetch(url, opts).then(function (res) {
                        if (!res || !res.ok) {
                            finish(new Error('status ' + (res ? res.status : '0')));
                            return;
                        }
                        res.text().then(function (text) {
                            finish(null, text);
                        }, function (err) {
                            finish(err || new Error('read failed'));
                        });
                    }, function (err) {
                        finish(err || new Error('network'));
                    });
                });
            }

            /* Same-origin proxy first; a direct fetch is the last resort
               (gutenberg.org sends no CORS headers, so it usually fails). */
            function fetchText(target) {
                return tryFetch(proxyUrl(target), TIMEOUT).catch(function () {
                    return tryFetch(target, TIMEOUT);
                });
            }

            /* ---------------- BROWSER CACHE ---------------- */
            function openCache() {
                if (typeof caches === 'undefined' || !caches || typeof caches.open !== 'function') {
                    return null;
                }
                try {
                    return caches.open(CACHE_NAME).catch(function () {
                        return null;
                    });
                } catch (e) {
                    return null;
                }
            }

            function cacheGet(url) {
                var p = openCache();
                if (!p) return Promise.resolve(null);
                return p.then(function (cache) {
                    if (!cache) return null;
                    return cache.match(url).then(function (res) {
                        if (!res) return null;
                        return res.text();
                    });
                }).catch(function () {
                    return null;
                });
            }

            function cachePut(url, text) {
                var p = openCache();
                if (!p) return Promise.resolve();
                return p.then(function (cache) {
                    if (!cache) return;
                    return cache.put(url, new Response(text, {
                        headers: { 'Content-Type': 'text/plain; charset=utf-8' }
                    }));
                }).catch(function () { /* best effort */ });
            }

            /* ---------------- OPDS PARSING ---------------- */
            function absolutise(href) {
                if (!href) return '';
                if (/^https?:\/\//i.test(href)) return href;
                if (href.charAt(0) === '/') return GUTENBERG + href;
                return GUTENBERG + '/' + href;
            }

            function parseOpdsFeed(xml) {
                /* Thumbnails are multi-KB base64 data URIs; drop them before
                   matching entries so the regex pass stays cheap. */
                var clean = String(xml).replace(/<link[^>]*rel="http:\/\/opds-spec\.org\/image[^>]*\/>/g, '');
                var books = [];
                var re = /<entry>([\s\S]*?)<\/entry>/g;
                var m;

                while ((m = re.exec(clean)) !== null) {
                    var block = m[1];

                    /* Authors/Subjects subsections have no numeric ebook id. */
                    var idMatch = block.match(/ebooks\/(\d+)\.opds/);
                    if (!idMatch) continue;

                    var title = '';
                    var titleMatch = block.match(/<title[^>]*>([\s\S]*?)<\/title>/);
                    if (titleMatch) title = trim(decodeEntities(stripTags(titleMatch[1])));

                    var author = '';
                    var authorMatch = block.match(/<content[^>]*type="text"[^>]*>([\s\S]*?)<\/content>/);
                    if (authorMatch) author = trim(decodeEntities(stripTags(authorMatch[1])));

                    if (!title) title = tr('gutenberg.untitled', 'Untitled');
                    if (!author) author = tr('gutenberg.author.unknown', 'Unknown author');

                    books.push({ id: idMatch[1], title: title, author: author });
                }

                var nextUrl = '';
                var nextMatch = clean.match(/<link[^>]*rel="next"[^>]*href="([^"]+)"/);
                if (!nextMatch) {
                    nextMatch = clean.match(/<link[^>]*href="([^"]+)"[^>]*rel="next"/);
                }
                if (nextMatch) nextUrl = absolutise(decodeEntities(nextMatch[1]));

                return { books: books, nextUrl: nextUrl };
            }

            /* ---------------- RECENT SHELF ---------------- */
            function readRecent() {
                var arr = readJson(RECENT_KEY, []);
                if (!Array.isArray(arr)) return [];
                var out = [];
                for (var i = 0; i < arr.length; i++) {
                    var item = arr[i];
                    if (!item || typeof item.id === 'undefined' || item.id === null) continue;
                    out.push({
                        id: item.id,
                        title: item.title ? String(item.title) : '',
                        author: item.author ? String(item.author) : '',
                        pct: typeof item.pct === 'number' ? item.pct : 0,
                        ts: typeof item.ts === 'number' ? item.ts : 0
                    });
                }
                out.sort(function (a, b) { return b.ts - a.ts; });
                return out.slice(0, MAX_RECENT);
            }

            function saveRecent(list) {
                writeJson(RECENT_KEY, list.slice(0, MAX_RECENT));
            }

            function addRecent(book) {
                var list = readRecent();
                var out = [];
                var prevPct = 0;
                for (var i = 0; i < list.length; i++) {
                    if (String(list[i].id) === String(book.id)) {
                        prevPct = list[i].pct || 0;
                    } else {
                        out.push(list[i]);
                    }
                }
                out.unshift({
                    id: book.id,
                    title: book.title || '',
                    author: book.author || '',
                    pct: prevPct,
                    ts: Date.now()
                });
                saveRecent(out);
            }

            function updateRecentPct(id, pct) {
                var list = readRecent();
                var changed = false;
                for (var i = 0; i < list.length; i++) {
                    if (String(list[i].id) === String(id)) {
                        list[i].pct = pct;
                        list[i].ts = Date.now();
                        changed = true;
                        break;
                    }
                }
                if (changed) saveRecent(list);
            }

            function removeRecent(id) {
                var list = readRecent();
                var out = [];
                for (var i = 0; i < list.length; i++) {
                    if (String(list[i].id) !== String(id)) out.push(list[i]);
                }
                saveRecent(out);
                renderShelf();
            }

            function renderShelf() {
                var list = readRecent();
                shelfList.innerHTML = '';
                if (!list.length) {
                    shelf.style.display = 'none';
                    return;
                }
                shelf.style.display = 'block';

                for (var i = 0; i < list.length; i++) {
                    (function (entry) {
                        var row = document.createElement('div');
                        row.className = 'recent';

                        var open = document.createElement('button');
                        open.type = 'button';
                        open.className = 'recent-open';

                        var title = document.createElement('span');
                        title.className = 'recent-title';
                        title.textContent = entry.title || tr('gutenberg.untitled', 'Untitled');

                        var meta = document.createElement('span');
                        meta.className = 'recent-meta';
                        var pctText = tr('gutenberg.label.progress', '${pct}% read')
                            .replace('${pct}', String(Math.round(entry.pct || 0)));
                        meta.textContent = (entry.author || tr('gutenberg.author.unknown', 'Unknown author')) +
                            '  ' + pctText;

                        open.appendChild(title);
                        open.appendChild(meta);
                        open.onclick = function () {
                            openRecent(entry);
                        };

                        var x = document.createElement('button');
                        x.type = 'button';
                        x.className = 'recent-x';
                        x.textContent = 'x';
                        x.title = tr('gutenberg.shelf.remove', 'Remove from shelf');
                        x.onclick = function () {
                            removeRecent(entry.id);
                        };

                        row.appendChild(open);
                        row.appendChild(x);
                        shelfList.appendChild(row);
                    })(list[i]);
                }
            }

            /* ---------------- SEARCH ---------------- */
            function setStatus(msg, isError) {
                searchStatus.textContent = msg || '';
                searchStatus.className = isError ? 'status status-error' : 'status';
                searchStatus.style.display = msg ? 'block' : 'none';
            }

            function searchUrl(q) {
                return GUTENBERG + '/ebooks/search.opds/?query=' + encodeURIComponent(q);
            }

            function buildBookRow(book) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'book';

                var title = document.createElement('span');
                title.className = 'book-title';
                title.textContent = book.title;

                var author = document.createElement('span');
                author.className = 'book-meta';
                author.textContent = book.author;

                btn.appendChild(title);
                btn.appendChild(author);
                btn.onclick = function () {
                    openBook(book);
                };
                return btn;
            }

            function fetchFeed(url, replace) {
                var reqId = ++state.reqId;

                return fetchText(url).then(function (xml) {
                    if (reqId !== state.reqId) return false;
                    if (!xml || xml.indexOf('<feed') === -1) {
                        throw new Error('bad feed');
                    }

                    var parsed = parseOpdsFeed(xml);

                    if (replace) {
                        results.innerHTML = '';
                        state.books = [];
                    }

                    if (!parsed.books.length) {
                        if (replace) setStatus(tr('gutenberg.error.empty', 'No books found.'), false);
                        state.hasNext = false;
                        state.nextUrl = '';
                        moreWrap.style.display = 'none';
                        return true;
                    }

                    setStatus('', false);

                    var known = {};
                    var i;
                    for (i = 0; i < state.books.length; i++) {
                        known[String(state.books[i].id)] = true;
                    }

                    for (i = 0; i < parsed.books.length; i++) {
                        var book = parsed.books[i];
                        if (known[String(book.id)]) continue;
                        known[String(book.id)] = true;
                        state.books.push(book);
                        results.appendChild(buildBookRow(book));
                    }

                    state.nextUrl = parsed.nextUrl;
                    state.hasNext = !!parsed.nextUrl;
                    moreWrap.style.display = state.hasNext ? 'block' : 'none';
                    return true;
                }).catch(function () {
                    if (reqId !== state.reqId) return false;
                    setStatus(tr('gutenberg.error.network',
                        'Could not reach the library. Check your connection.'), true);
                    return false;
                });
            }

            function doSearch(term) {
                var q = trim(typeof term === 'string' ? term : input.value);
                if (!q) {
                    setStatus(tr('gutenberg.error.query', 'Type a title or author to search.'), true);
                    return;
                }

                input.value = q;
                state.query = q;
                state.nextUrl = '';
                state.hasNext = false;
                state.loadingMore = false;
                state.reqId++;
                results.innerHTML = '';
                moreWrap.style.display = 'none';
                setStatus(tr('gutenberg.status.searching', 'Searching...'), false);
                fetchFeed(searchUrl(q), true);
            }

            function loadMore() {
                if (!state.hasNext || !state.nextUrl || state.loadingMore) return;

                state.loadingMore = true;
                moreBtn.disabled = true;
                setStatus(tr('gutenberg.status.searching', 'Searching...'), false);

                fetchFeed(state.nextUrl, false).then(function () {
                    state.loadingMore = false;
                    moreBtn.disabled = false;
                });
            }

            /* ---------------- READER ---------------- */
            function showView(name) {
                state.view = name;
                byId('view-search').style.display = (name === 'search') ? 'flex' : 'none';
                byId('view-reader').style.display = (name === 'reader') ? 'flex' : 'none';
            }

            function setReaderHeader(book) {
                rTitle.textContent = book.title || tr('gutenberg.untitled', 'Untitled');
                rAuthor.textContent = book.author || tr('gutenberg.author.unknown', 'Unknown author');
            }

            function textCandidates(id) {
                var idPart = encodeURIComponent(String(id));
                return [
                    GUTENBERG + '/cache/epub/' + idPart + '/pg' + idPart + '.txt',
                    GUTENBERG + '/files/' + idPart + '/' + idPart + '-0.txt',
                    GUTENBERG + '/ebooks/' + idPart + '.txt.utf-8'
                ];
            }

            async function loadBookText(id) {
                var urls = textCandidates(id);
                var i;

                /* Cache-first: reopening a book must be instant. */
                for (i = 0; i < urls.length; i++) {
                    var cached = await cacheGet(urls[i]);
                    if (cached) return cached;
                }

                var lastErr = null;
                for (i = 0; i < urls.length; i++) {
                    try {
                        var raw = await fetchText(urls[i]);
                        if (raw && raw.length) {
                            await cachePut(urls[i], raw);
                            return raw;
                        }
                    } catch (e) {
                        lastErr = e;
                    }
                }
                throw lastErr || new Error('no text');
            }

            function openRecent(entry) {
                if (state.busy) return;
                openBook({
                    id: entry.id,
                    title: entry.title,
                    author: entry.author
                });
            }

            async function openBook(book) {
                if (state.busy) return;
                if (state.book && state.ready) savePositionNow();

                state.busy = true;
                state.ready = false;
                state.book = book;
                state.headings = [];
                state.pages = 1;
                state.pageIndex = 0;
                state.pct = 0;

                showView('reader');
                setReaderHeader(book);
                notice.style.display = 'none';
                notice.textContent = '';
                pageInd.textContent = '';
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                pane.scrollTop = 0;
                pane.innerHTML = '<p class="gb-status">' +
                    esc(tr('gutenberg.status.loading', 'Opening book...')) + '</p>';

                try {
                    var raw = await loadBookText(book.id);
                    var text = cleanText(raw);

                    if (!text) throw new Error('empty');

                    var truncated = false;
                    if (text.length > MAX_CHARS) {
                        text = text.slice(0, MAX_CHARS);
                        truncated = true;
                    }

                    renderText(text);

                    if (truncated) {
                        notice.textContent = tr('gutenberg.notice.long', 'Long book: showing the first part.');
                        notice.style.display = 'block';
                    }

                    pane.scrollTop = 0;
                    state.ready = true;
                    restorePosition(book.id);
                    addRecent(book);
                    updateFontButtons();
                } catch (e) {
                    pane.innerHTML = '<p class="gb-status gb-error">' +
                        esc(tr('gutenberg.error.book', 'Could not open this book. Try again.')) + '</p>';
                }

                state.busy = false;
            }

            function renderText(text) {
                var blocks = text.split(/\n{2,}/);
                var out = [];
                var headings = [];
                var i, line;

                for (i = 0; i < blocks.length; i++) {
                    if (!blocks[i]) continue;
                    line = trim(blocks[i].replace(/\n/g, ' ').replace(/[ \t]+/g, ' '));
                    if (!line) continue;

                    if (headings.length < MAX_TOC && isHeading(line)) {
                        var id = 'gb-h-' + headings.length;
                        headings.push({ id: id, label: line });
                        out.push('<p class="gb-h" id="' + id + '">' + esc(line) + '</p>');
                    } else {
                        out.push('<p>' + esc(line) + '</p>');
                    }
                }

                /* One wrapper node keeps the i18n MutationObserver from walking
                   thousands of paragraphs one-by-one. */
                var body = document.createElement('div');
                body.className = 'gb-body';
                body.innerHTML = out.join('');

                pane.innerHTML = '';
                pane.appendChild(body);
                state.headings = headings;
            }

            /* ---------------- TEXT CLEANUP ---------------- */
            function cleanText(raw) {
                var text = String(raw || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');

                var startRe = /\*\*\*\s*START OF (?:THE|THIS) PROJECT GUTENBERG EBOOK[^\n]*\*\*\*/i;
                var endRe = /\*\*\*\s*END OF (?:THE|THIS) PROJECT GUTENBERG EBOOK[^\n]*\*\*\*/i;

                var startMatch = startRe.exec(text);
                if (startMatch) {
                    text = text.slice(startMatch.index + startMatch[0].length);
                }
                var endMatch = endRe.exec(text);
                if (endMatch) {
                    text = text.slice(0, endMatch.index);
                }

                text = text.replace(/\n{3,}/g, '\n\n');
                return trim(text);
            }

            /* ---------------- HEADINGS ---------------- */
            function looksTitleCased(line) {
                if (line === line.toUpperCase()) return true;
                var words = line.split(' ');
                for (var i = 0; i < words.length; i++) {
                    var w = words[i];
                    if (!w) continue;
                    var first = w.charAt(0);
                    if (first === first.toUpperCase()) continue;
                    var bare = trim(w.toLowerCase().replace(/[^a-z]/g, ''));
                    if (i > 0 && SMALL_WORDS[bare]) continue;
                    return false;
                }
                return true;
            }

            function isHeading(line) {
                if (!line || line.length > 60) return false;
                if (!HEAD_RE.test(line)) return false;
                return looksTitleCased(line);
            }

            /* ---------------- PAGINATION ---------------- */
            function pageHeight() {
                return Math.max(1, pane.clientHeight || 1);
            }

            function scrollMax() {
                return Math.max(0, pane.scrollHeight - pageHeight());
            }

            function measure() {
                var h = pageHeight();
                var total = Math.ceil(pane.scrollHeight / h);
                if (!isFinite(total) || total < 1) total = 1;

                var max = scrollMax();

                /* Round so the last, partial page is reachable; pin the index
                   when the pane is scrolled to the very bottom. */
                var idx;
                if (max > 0 && pane.scrollTop >= max - 0.5) {
                    idx = total - 1;
                } else {
                    idx = Math.round(pane.scrollTop / h);
                }
                if (idx < 0) idx = 0;
                if (idx > total - 1) idx = total - 1;

                state.pages = total;
                state.pageIndex = idx;
                state.pct = max > 0 ? (pane.scrollTop / max) : 0;
                updatePager();
            }

            function updatePager() {
                pageInd.textContent = tr('gutenberg.label.page', 'Page ${page} / ${pages}')
                    .replace('${page}', String(state.pageIndex + 1))
                    .replace('${pages}', String(state.pages));
                prevBtn.disabled = state.pageIndex <= 0;
                nextBtn.disabled = state.pageIndex >= state.pages - 1;
            }

            function goPage(delta) {
                if (!state.ready) return;
                var h = pageHeight();
                var max = scrollMax();
                var target = (state.pageIndex + delta) * h;

                if (target < 0) target = 0;
                if (target > max) target = max;

                pane.scrollTop = target;
                measure();
                savePositionNow();
            }

            function scrollPct() {
                var max = scrollMax();
                if (max <= 0) return 0;
                var pct = pane.scrollTop / max;
                if (pct < 0) pct = 0;
                if (pct > 1) pct = 1;
                return pct;
            }

            /* ---------------- POSITION ---------------- */
            function positionKey(id) {
                return POS_PREFIX + String(id);
            }

            function savePositionNow() {
                if (!state.book || !state.ready) return;
                var max = scrollMax();
                var pct = max > 0 ? Math.round(scrollPct() * 100) : 0;
                if (pct < 0) pct = 0;
                if (pct > 100) pct = 100;
                writeJson(positionKey(state.book.id), {
                    scrollTop: Math.round(pane.scrollTop),
                    pct: pct
                });
                updateRecentPct(state.book.id, pct);
            }

            function scheduleSave() {
                if (saveTimer) clearTimeout(saveTimer);
                saveTimer = setTimeout(function () {
                    saveTimer = null;
                    savePositionNow();
                }, 600);
            }

            function restorePosition(id) {
                var pos = readJson(positionKey(id), null);
                var max = scrollMax();
                var target = 0;

                if (pos) {
                    if (typeof pos.scrollTop === 'number' && isFinite(pos.scrollTop)) {
                        target = pos.scrollTop;
                    } else if (typeof pos.pct === 'number' && isFinite(pos.pct)) {
                        target = max * (pos.pct / 100);
                    }
                }

                if (!(target >= 0)) target = 0;
                if (target > max) target = max;

                pane.scrollTop = target;
                measure();
            }

            /* ---------------- FONT SIZE ---------------- */
            function readFont() {
                try {
                    var raw = parseInt(localStorage.getItem(FONT_KEY), 10);
                    if (FONTS.indexOf(raw) !== -1) return raw;
                } catch (e) { /* ignore */ }
                return 18;
            }

            function updateFontButtons() {
                var idx = FONTS.indexOf(state.font);
                if (idx < 0) idx = 1;
                byId('btn-fontdown').disabled = idx <= 0;
                byId('btn-fontup').disabled = idx >= FONTS.length - 1;
            }

            function changeFont(delta) {
                var idx = FONTS.indexOf(state.font);
                if (idx < 0) idx = 1;
                idx += delta;
                if (idx < 0) idx = 0;
                if (idx > FONTS.length - 1) idx = FONTS.length - 1;

                var px = FONTS[idx];
                if (px === state.font) return;

                var keep = state.pct;
                state.font = px;
                try {
                    localStorage.setItem(FONT_KEY, String(px));
                } catch (e) { /* ignore */ }

                pane.style.fontSize = px + 'px';

                var max = scrollMax();
                pane.scrollTop = max * keep;
                measure();
                updateFontButtons();
                if (state.ready) savePositionNow();
            }

            /* ---------------- CONTENTS ---------------- */
            function openContents() {
                tocList.innerHTML = '';

                if (!state.headings.length) {
                    var empty = document.createElement('div');
                    empty.className = 'toc-empty';
                    empty.textContent = tr('gutenberg.error.nocontents', 'No chapters found.');
                    tocList.appendChild(empty);
                } else {
                    for (var i = 0; i < state.headings.length; i++) {
                        var btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'toc-item';
                        btn.textContent = state.headings[i].label;
                        btn.setAttribute('data-idx', String(i));
                        btn.onclick = onTocClick;
                        tocList.appendChild(btn);
                    }
                }
                modal.classList.add('open');
            }

            function closeContents() {
                modal.classList.remove('open');
            }

            function onTocClick() {
                var idx = parseInt(this.getAttribute('data-idx'), 10);
                var entry = state.headings[idx];
                if (entry) {
                    var target = byId(entry.id);
                    if (target) {
                        var paneRect = pane.getBoundingClientRect();
                        var targetRect = target.getBoundingClientRect();
                        var top = pane.scrollTop + (targetRect.top - paneRect.top) - 2;
                        if (top < 0) top = 0;
                        var max = scrollMax();
                        if (top > max) top = max;
                        pane.scrollTop = top;
                        measure();
                        if (state.ready) savePositionNow();
                    }
                }
                closeContents();
            }

            /* ---------------- HEADER COLLAPSE ---------------- */
            function toggleHeader() {
                var keep = state.pct;
                if (head.className.indexOf('collapsed') === -1) {
                    head.className = 'collapsed';
                    headToggle.textContent = '+';
                } else {
                    head.className = '';
                    headToggle.textContent = '-';
                }
                if (state.ready) {
                    var max = scrollMax();
                    pane.scrollTop = max * keep;
                    measure();
                }
            }

            /* ---------------- EVENT WIRING ---------------- */
            function wire() {
                searchBtn.onclick = function () {
                    doSearch(null);
                };

                input.addEventListener('keydown', function (e) {
                    if (e.keyCode === 13 || e.key === 'Enter') {
                        e.preventDefault();
                        doSearch(null);
                    }
                });

                chips.addEventListener('click', function (e) {
                    var node = e.target;
                    while (node && node !== chips) {
                        if (node.getAttribute && node.getAttribute('data-q')) {
                            doSearch(node.getAttribute('data-q'));
                            return;
                        }
                        node = node.parentNode;
                    }
                });

                moreBtn.onclick = loadMore;

                prevBtn.onclick = function () { goPage(-1); };
                nextBtn.onclick = function () { goPage(1); };

                byId('btn-fontdown').onclick = function () { changeFont(-1); };
                byId('btn-fontup').onclick = function () { changeFont(1); };

                byId('btn-contents').onclick = openContents;
                tocClose.onclick = closeContents;

                modal.onclick = function (e) {
                    if (e.target === modal) closeContents();
                };

                byId('btn-back').onclick = function () {
                    if (state.ready) savePositionNow();
                    showView('search');
                    renderShelf();
                };

                headToggle.onclick = toggleHeader;

                pane.addEventListener('scroll', function () {
                    if (state.view !== 'reader' || !state.ready) return;
                    if (scrollTimer) return;
                    scrollTimer = setTimeout(function () {
                        scrollTimer = null;
                        if (state.view !== 'reader' || !state.ready) return;
                        measure();
                        scheduleSave();
                    }, 120);
                });

                window.addEventListener('resize', function () {
                    if (resizeTimer) clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(function () {
                        resizeTimer = null;
                        if (state.view !== 'reader' || !state.ready) return;
                        var keep = state.pct;
                        measure();
                        var max = scrollMax();
                        pane.scrollTop = max * keep;
                        measure();
                        scheduleSave();
                    }, 300);
                });

                window.addEventListener('beforeunload', function () {
                    if (state.ready) savePositionNow();
                });

                document.addEventListener('keydown', function (e) {
                    if ((e.key === 'Escape' || e.keyCode === 27) && modal.classList.contains('open')) {
                        closeContents();
                    }
                });
            }

            /* ---------------- INIT ---------------- */
            function init() {
                pane = byId('pane');
                notice = byId('notice');
                pageInd = byId('page-ind');
                prevBtn = byId('btn-prev');
                nextBtn = byId('btn-next');
                rTitle = byId('r-title');
                rAuthor = byId('r-author');
                head = byId('reader-head');
                headToggle = byId('head-toggle');
                results = byId('results');
                moreWrap = byId('more-wrap');
                moreBtn = byId('more-btn');
                searchStatus = byId('search-status');
                shelf = byId('shelf');
                shelfList = byId('shelf-list');
                input = byId('q');
                modal = byId('gb-modal');
                tocList = byId('toc-list');
                tocClose = byId('toc-close');
                searchBtn = byId('search-btn');
                chips = byId('chips');

                if (window.rekindleApplyWallpaper) window.rekindleApplyWallpaper();

                state.font = readFont();
                pane.style.fontSize = state.font + 'px';

                headToggle.textContent = '-';
                headToggle.title = tr('gutenberg.head.toggle', 'Show or hide book details');
                headToggle.setAttribute('aria-label', tr('gutenberg.head.toggle', 'Show or hide book details'));

                updatePager();
                updateFontButtons();
                renderShelf();
                wire();
                showView('search');
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>

</body>

</html>
